x-ozone-common-config: &ozone-common-config
  image: apache/ozone:2.0.0
  env_file:
    - .env
    - docker-config

x-ozone-replication: &ozone-replication
  OZONE-SITE.XML_ozone.server.default.replication: ${OZONE_REPLICATION_FACTOR:-1}

services:
  tika:
    image: logicalspark/docker-tikaserver:latest
    container_name: biar-tika
    restart: unless-stopped
    env_file:
      - .env
    environment:
      JAVA_OPTS: -Xms256m -Xmx512m
    ports:
      - "${TIKA_PORT}:9998"

  solr:
    image: solr:9
    container_name: biar-solr
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${SOLR_PORT}:8983"
    volumes:
      - solr_data:/var/solr
    environment:
      SOLR_HEAP: 512m
    command:
      - sh
      - -c
      - "solr-precreate biar_docs /opt/solr/server/solr/configsets/sample_techproducts_configs"

  nifi:
    build:
      context: ./nifi
      dockerfile: Dockerfile
    image: custom-nifi:1.24.0
    container_name: biar-nifi
    hostname: nifi
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NIFI_JVM_HEAP_INIT: 512m
      NIFI_JVM_HEAP_MAX: 1g
    ports:
      - "${NIFI_PORT}:8088"
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_db:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository

  scm:
    <<: *ozone-common-config
    container_name: ozone-scm-1
    restart: unless-stopped
    env_file:
      - .env
      - docker-config
    ports:
      - 9876:9876
    environment:
      <<: *ozone-replication
      ENSURE_SCM_INITIALIZED: /data/metadata/scm/current/VERSION
      OZONE-SITE.XML_hdds.scm.safemode.min.datanode: 1
    command: ["ozone", "scm"]
    volumes:
      - scm_data:/data

  om:
    <<: *ozone-common-config
    container_name: ozone-om-1
    restart: unless-stopped
    env_file:
      - .env
      - docker-config
    ports:
      - 9862:9862
    environment:
      <<: *ozone-replication
      ENSURE_OM_INITIALIZED: /data/metadata/om/current/VERSION
    command: ["ozone", "om"]
    volumes:
      - om_data:/data

  datanode1:
    <<: *ozone-common-config
    container_name: ozone-datanode-1
    hostname: ozone-datanode-1
    restart: unless-stopped
    env_file:
      - .env
      - docker-config
    environment:
      <<: *ozone-replication
      OZONE-SITE.XML_hdds.datanode.hostname: ozone-datanode-1
      OZONE-SITE.XML_hdds.datanode.bind.host: 0.0.0.0
      OZONE-SITE.XML_hdds.datanode.address: ozone-datanode-1:9864
      OZONE-SITE.XML_hdds.container.ipc.address: ozone-datanode-1:9859
      OZONE-SITE.XML_hdds.container.ratis.ipc.address: ozone-datanode-1:9858
    command: ["ozone", "datanode"]
    volumes:
      - datanode1_data:/data

  datanode2:
    <<: *ozone-common-config
    container_name: ozone-datanode-2
    hostname: ozone-datanode-2
    restart: unless-stopped
    env_file:
      - .env
      - docker-config
    environment:
      <<: *ozone-replication
      OZONE-SITE.XML_hdds.datanode.hostname: ozone-datanode-2
      OZONE-SITE.XML_hdds.datanode.bind.host: 0.0.0.0
      OZONE-SITE.XML_hdds.datanode.address: ozone-datanode-2:9864
      OZONE-SITE.XML_hdds.container.ipc.address: ozone-datanode-2:9859
      OZONE-SITE.XML_hdds.container.ratis.ipc.address: ozone-datanode-2:9858

    command: ["ozone", "datanode"]
    volumes:
      - datanode2_data:/data

  datanode3:
    <<: *ozone-common-config
    container_name: ozone-datanode-3
    hostname: ozone-datanode-3
    restart: unless-stopped
    env_file:
      - .env
      - docker-config
    environment:
      <<: *ozone-replication
      OZONE-SITE.XML_hdds.datanode.hostname: ozone-datanode-3
      OZONE-SITE.XML_hdds.datanode.bind.host: 0.0.0.0
      OZONE-SITE.XML_hdds.datanode.address: ozone-datanode-3:9864
      OZONE-SITE.XML_hdds.container.ipc.address: ozone-datanode-3:9859
      OZONE-SITE.XML_hdds.container.ratis.ipc.address: ozone-datanode-3:9858
    command: ["ozone", "datanode"]
    volumes:
      - datanode3_data:/data

  recon:
    <<: *ozone-common-config
    container_name: ozone-recon-1
    hostname: recon
    restart: unless-stopped
    env_file:
      - .env
      - docker-config
    ports:
      - 9888:9888
    environment:
      <<: *ozone-replication
      OZONE-SITE.XML_ozone.recon.address: recon:9891
      OZONE-SITE.XML_ozone.recon.http-address: 0.0.0.0:9888
    command: ["ozone", "recon"]
    volumes:
      - recon_data:/data
    depends_on:
      - scm
      - om

  s3g:
    <<: *ozone-common-config
    container_name: ozone-s3g-1
    restart: unless-stopped
    env_file:
      - .env
      - docker-config
    ports:
      - 9878:9878
    environment:
      <<: *ozone-replication
    command: ["ozone", "s3g"]
    depends_on:
      - scm
      - om
  
  automation-orchestrator:
    build:
      context: ./automation-orchestrator
      dockerfile: Dockerfile
    container_name: biar-automation-orchestrator
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - 7619:7619
    volumes:
      - ./automation-orchestrator/out:/app/out
      - ${TAZAMA_WAREHOUSE_HOST_PATH}:/opt/Tazama_Warehouse
    tmpfs:
      - /tmp/spark
    depends_on:
      - s3g

  datalakehouse-api:
    build:
      context: ./datalakehouse-api
      dockerfile: Dockerfile
    container_name: biar-datalakehouse-api
    restart: unless-stopped
    env_file:
      - .env
    environment:
      WAREHOUSE_ROOT: /opt/Tazama_Warehouse
    ports:
      - 8282:8282
    volumes:
      - ${TAZAMA_WAREHOUSE_HOST_PATH}:/opt/Tazama_Warehouse
    depends_on:
      - s3g

  jupyterlab:
    build:
      context: ./JupyterHub
      dockerfile: Dockerfile
    container_name: biar-jupyterlab
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${JUPYTERLAB_PORT}:8888"
    volumes:
      - ./JupyterHub/notebooks:/srv/notebooks
      - ${TAZAMA_WAREHOUSE_HOST_PATH}:/opt/Tazama_Warehouse
    tmpfs:
      - /tmp/spark
    depends_on:
      - s3g

  aws-cli:
    image: amazon/aws-cli
    container_name: ozone-aws-cli
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - s3g
    entrypoint: >
      /bin/sh -c "
      export AWS_ACCESS_KEY_ID=$$S3A_ACCESS_KEY;
      export AWS_SECRET_ACCESS_KEY=$$S3A_SECRET_KEY;
      export AWS_DEFAULT_REGION=us-east-1;

      echo 'Waiting for S3...';
      until aws --endpoint-url $$S3A_ENDPOINT s3 ls > /dev/null 2>&1; do
        sleep 3;
      done;

      echo 'Creating bucket if not exists...';
      aws --endpoint-url $$S3A_ENDPOINT s3 mb s3://$$AWS_BUCKET_NAME || true;

      tail -f /dev/null
      "

  nifi-init:
    image: curlimages/curl:latest
    container_name: nifi-init
    restart: on-failure
    env_file:
      - .env
    depends_on:
      - nifi
    volumes:
      - ./nifi:/nifi:ro
    entrypoint: ["/bin/sh", "/nifi/init.sh"]
  
  # unstructured-pipeline:
  #   build:
  #     context: ./unstructured-pipeline
  #     dockerfile: Dockerfile
  #   container_name: biar-unstructured-pipeline
  #   restart: unless-stopped
  #   env_file:
  #     - .env
  #   environment:
  #     TIKA_SERVER_URL: http://tika:${TIKA_PORT}/tika
  #     SOLR_URL: http://solr:${SOLR_PORT}/solr/biar_docs
  #   depends_on:
  #     - tika
  #     - solr

volumes:
  solr_data:
  nifi_conf:
  nifi_state:
  nifi_db:
  nifi_flowfile:
  nifi_content:
  nifi_provenance:
  scm_data:
  om_data:
  datanode1_data:
  datanode2_data:
  datanode3_data:
  recon_data:
