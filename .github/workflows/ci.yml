name: CI

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

jobs:
  ts-build:
    if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
    name: TypeScript Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unstructured-pipeline
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Build
        run: npm run build

  ts-lint:
    if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
    name: TypeScript Lint
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unstructured-pipeline
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Lint
        run: npm run lint

  ts-test:
    if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
    name: TypeScript Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: unstructured-pipeline
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020  # v4.4.0
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}

      - name: Run tests
        run: npm test

  python-lint:
    if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
    name: Python Lint
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5.6.0
        with:
          python-version: '3.9'

      - name: Install ruff
        run: pip install ruff

      - name: Lint Python
        run: ruff check automation-orchestrator/ datalakehouse-api/ JupyterHub/

  docker-build-check:
    if: github.actor != 'dependabot[bot]' && github.actor != 'dependabot-preview[bot]'
    name: Docker Build Check
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd  # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0

      - name: Build automation-orchestrator
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: ./automation-orchestrator
          file: ./automation-orchestrator/Dockerfile
          push: false

      - name: Build datalakehouse-api
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: ./datalakehouse-api
          file: ./datalakehouse-api/Dockerfile
          push: false

      - name: Build JupyterHub
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: ./JupyterHub
          file: ./JupyterHub/Dockerfile
          push: false

      - name: Build unstructured-pipeline
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: ./unstructured-pipeline
          file: ./unstructured-pipeline/Dockerfile
          push: false
          secrets: |
            GH_TOKEN=${{ secrets.GH_TOKEN }}

      - name: Build nifi
        uses: docker/build-push-action@d08e5c354a6adb9ed34480a06d141179aa583294
        with:
          context: ./nifi
          file: ./nifi/Dockerfile
          push: false
