version: '3.8'

services:
  tazama-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tazama-lakehouse
    hostname: tazama
    ports:
      # Spark ports
      - "7077:7077"     # Spark Master
      - "8087:8087"     # Spark Master UI
      - "8081:8081"     # Spark Worker UI
      - "4040:4040"     # Spark Application UI (primary)
      - "4041:4041"     # Spark Application UI
      - "4042:4042"     # Spark Application UI
      - "4043:4043"     # Spark Application UI
      
      # FastAPI ports
      - "8001:8001"     # FastAPI Arif Bhai
      - "8002:8002"     # FastAPI iZyane
      - "8003:8003"     # FastAPI Asim Test
      
      # JupyterHub/Jupyter ports
      - "8000:8000"     # JupyterHub
      - "8888:8888"     # Jupyter Notebook (fallback)
    
    volumes:
      # Mount notebooks directory to persist changes
      - ./notebooks:/app/notebooks
      # Mount Hudi warehouse directory to persist Hudi data
      - ./Tazama_Hudi_warehouse:/app/Tazama_Hudi_warehouse
      
      # Mount logs for debugging
      - ./logs:/var/log
    
    # DNS configuration for internet access
    dns:
      - 8.8.8.8
      - 8.8.4.4
      - 1.1.1.1
    
    # Network configuration
    network_mode: bridge
    
    environment:
      - SPARK_HOME=/usr/local/lib/python3.10/dist-packages/pyspark
      - JAVA_HOME=/usr/lib/jvm/java-11-openjdk-amd64
      - PYSPARK_PYTHON=python3
      - PYSPARK_DRIVER_PYTHON=python3
      # Adjust memory settings based on your host machine
      - SPARK_DRIVER_MEMORY=4g
      - SPARK_EXECUTOR_MEMORY=4g
      # Warehouse root path (relative to /app inside container)
      - WAREHOUSE_ROOT=/app/Tazama_Hudi_warehouse
    
    # Resource limits (adjust based on your host machine)
    deploy:
      resources:
        limits:
          cpus: '4'
          memory: 8G
        reservations:
          cpus: '2'
          memory: 4G
    
    # Keep container running
    restart: unless-stopped
    
    # Health check
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/hub/api"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

volumes:
  notebooks:
  logs:
